name: Refresh Fantasy Marca data

# Lunes: resultados del fin de semana. Jueves y viernes (mañana y tarde):
# lesiones, dudas y sanciones justo antes del cierre (primer partido, que
# suele ser el viernes por la noche). Sábado y domingo por la mañana: bajas
# de última hora para los que aún no han jugado. Horas en UTC (en España
# son +1/+2); GitHub puede retrasar los cron unos minutos.
on:
  schedule:
    - cron: "0 7 * * 1,4,5"
    - cron: "0 15 * * 5"
    - cron: "0 8 * * 6,0"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Dispara deploy.yml aunque no cambien los datos"
        type: boolean
        default: false
      runner:
        # analiticafantasy bloquea (403) a los servidores de GitHub. "local"
        # ejecuta el refresco en el runner del ordenador de casa, que solo
        # está conectado mientras corre ./actualizar.sh. Solo se puede elegir
        # lanzándolo a mano (los cron y los pull requests nunca lo usan).
        description: "Dónde ejecutarlo"
        type: choice
        options: [github, local]
        default: github

permissions:
  contents: write
  # Para disparar deploy.yml al final (ver el último paso).
  actions: write

jobs:
  refresh:
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted", "fantasymarca-local"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: inputs.runner != 'local'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python del ordenador local (venv reutilizable)
        # setup-python no tiene versiones para todas las distribuciones; en
        # local se usa el python3 del sistema en un venv que se conserva
        # entre ejecuciones para no reinstalar pandas/scikit-learn cada vez.
        if: inputs.runner == 'local'
        run: |
          VENV="$RUNNER_TOOL_CACHE/fantasymarca-venv"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r fantasy_api/requirements.txt

      - name: Write credentials
        # Nunca interpolar el secret directamente en el script de shell: se pasa
        # por env y se escribe con json.dump para no depender de escaping manual.
        env:
          X_AUTH: ${{ secrets.FANTASY_X_AUTH }}
          REFRESH_TOKEN: ${{ secrets.FANTASY_REFRESH_TOKEN }}
        run: |
          python -c "
          import json, os
          with open('fantasy_api/auth_store.json', 'w', encoding='utf-8') as f:
              json.dump({'x_auth': os.environ['X_AUTH'], 'refresh_token': os.environ['REFRESH_TOKEN']}, f)
          "

      - name: Run main.py
        working-directory: fantasy_api
        run: python main.py

      - name: Scrape alineaciones probables (futbolfantasy + analiticafantasy)
        # Si la web de futbolfantasy falla o cambia, el modelo sigue
        # funcionando sin alineaciones: no debe bloquear el refresco.
        continue-on-error: true
        working-directory: fantasy_api
        run: python scrape_alineaciones.py

      - name: Train model and predict next gameweek
        working-directory: fantasy_api
        run: python ml_model.py

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualiza datos de fantasy.marca.com [automated]"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        # El push de arriba va firmado con GITHUB_TOKEN, y GitHub no encadena
        # workflows desde pushes hechos con ese token: deploy.yml no llegaba a
        # enterarse de los datos nuevos y el sitio se quedaba congelado.
        # workflow_dispatch sí es la excepción documentada a esa regla, así que
        # llamamos al deploy explícitamente cuando hubo cambios.
        if: steps.commit.outputs.changed == 'true' || inputs.force_deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Borrar credenciales
        # En el runner local el directorio de trabajo se queda en disco.
        if: always()
        run: rm -f fantasy_api/auth_store.json
